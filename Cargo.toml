[package]
name = "treenotes"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Content-versioned notes for Git repository files and directories, for external LLM agents"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/a1re1/tree-notes"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The integration tests use rusqlite and serde_json through the regular dependencies above.
tempfile = "3"

[profile.release]
lto = "thin"
